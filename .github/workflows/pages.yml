name: Website checks and Pages

on:
  push:
    branches: [gh-pages]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Check links and metadata
        run: |
          python3 scripts/check_site.py website
          python3 -B -m unittest discover -s website/tests -p '*_test.py'
      - name: Check JavaScript syntax and demo behavior
        run: |
          node --check website/site.js
          node --test website/tests/site.test.cjs
      - name: Upload website
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/gh-pages'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: website

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/gh-pages'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

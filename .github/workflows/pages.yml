name: Website checks and Pages

on:
  push:
    branches: [gh-pages]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check links and metadata
        run: |
          python3 scripts/check_site.py website
          python3 -B -m unittest discover -s website/tests -p '*_test.py'
      - name: Check JavaScript syntax and demo behavior
        run: |
          node --check website/site.js
          node --test website/tests/site.test.cjs
      - name: Upload website
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/gh-pages'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/gh-pages'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
